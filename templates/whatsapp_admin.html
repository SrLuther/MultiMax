{% block content %}
{% set auto_enabled = auto_enabled %}
<style>

    border-radius: 1.5rem;
    box-shadow: 0 4px 32px 0 rgba(80, 80, 160, 0.10);
    padding: 2.5rem 2rem 2rem 2rem;
    display: flex;
    align-items: center;

                                if (data.ok) {
                                    const status = data.status || 'Indisponível';
                                    document.getElementById('cronogramaStatusLabel').textContent = status;
                                    setCronogramaBadge(status, true);

                        function enviarCronogramaAgora() {
                            const btn = document.getElementById('btnEnviarCronograma');
                            btn.disabled = true;
                            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Enviando...';
                            fetch('/dev/whatsapp/cronograma/enviar', {
                                method: 'POST',
                                headers: { 'X-Requested-With': 'XMLHttpRequest' }

                            .then(data => {
                                if (data.ok) {
                                    notifyWhatsappAdmin('Sucesso', data.message || 'Mensagem enviada.', 'success');
                                } else {
                                    notifyWhatsappAdmin('Erro', data.error || 'Falha ao enviar mensagem', 'danger');
                                }
                            })
                            .catch(error => {
                                notifyWhatsappAdmin('Erro', 'Falha na comunicação: ' + error.message, 'danger');

        </div>
                            title="Enviar resumo diário do Fluxos agora"
                            onclick="enviarResumoFluxos()"
                        >
                            <i class="bi bi-calendar-check me-2"></i> Resumo diário (Fluxos)
                        </button>

                        <!-- Botão: Resumo geral do Fluxos -->
                        <button
                            type="button"
                            class="btn btn-outline-primary whatsapp-btn-premium"
                            id="btnEnviarResumoGeralFluxos"
                            title="Enviar resumo geral do Fluxos agora"
                            onclick="enviarResumoGeralFluxos()"
                        >
                            <i class="bi bi-clipboard-data me-2"></i> Resumo geral (Fluxos)
                        </button>
                    </div>

                    <script>
                        function enviarResumoFluxos() {
                            const confirmacao = confirm(
                                'Enviar o resumo diário do Fluxos agora?\n\nEsta ação ignora o horário das 20h e envia para o grupo configurado.'
                            );
                            if (!confirmacao) {
                                return;
                            }

                            const btn = document.getElementById('btnEnviarResumoFluxos');
                            btn.disabled = true;
                            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Enviando...';

                            fetch('/dev/whatsapp/fluxos/resumo-diario', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-Requested-With': 'XMLHttpRequest'
                                }
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.ok) {
                                    showNotification('Sucesso!', data.message, 'success');
                                } else {
                                    showNotification('Erro', data.error || 'Falha ao enviar resumo', 'danger');
                                }
                            })
                            .catch(error => {
                                showNotification('Erro', 'Falha na comunicação: ' + error.message, 'danger');
                            })
                            .finally(() => {
                                btn.disabled = false;
                                btn.innerHTML = '<i class="bi bi-calendar-check me-2"></i> Resumo diário (Fluxos)';
                            });
                        }

                        function enviarResumoGeralFluxos() {
                            const confirmacao = confirm(
                                'Enviar o resumo geral do Fluxos agora?\n\nEsta ação envia o resumo completo do fluxo atual para o grupo configurado.'
                            );
                            if (!confirmacao) {
                                return;
                            }

                            const btn = document.getElementById('btnEnviarResumoGeralFluxos');
                            btn.disabled = true;
                            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Enviando...';

                            fetch('/dev/whatsapp/fluxos/resumo-geral', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-Requested-With': 'XMLHttpRequest'
                                }
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.ok) {
                                    showNotification('Sucesso!', data.message, 'success');
                                } else {
                                    showNotification('Erro', data.error || 'Falha ao enviar resumo geral', 'danger');
                                }
                            })
                            .catch(error => {
                                showNotification('Erro', 'Falha na comunicação: ' + error.message, 'danger');
                            })
                            .finally(() => {
                                btn.disabled = false;
                                btn.innerHTML = '<i class="bi bi-clipboard-data me-2"></i> Resumo geral (Fluxos)';
                            });
                        }

                        function showNotification(title, message, type) {
                            alert((title ? title + '\n' : '') + message);
                        }
                    </script>
                </div>
            </div>
        </div>

        <!-- Bloco D - Cronograma -->
        <div class="col-12">
            <div class="card whatsapp-card-premium shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
                        <div>
                            <p class="text-uppercase text-white small mb-1">Bloco D — cronograma</p>
                            <h3 class="whatsapp-card-title mb-2 text-white"><i class="bi bi-calendar-check me-2"></i>Alertas do Cronograma</h3>
                            <p class="text-white-50 mb-0">Envio imediato da notificação do cronograma para o grupo.</p>
                        </div>
                        <span id="badgeCronogramaStatus" class="badge bg-light text-dark border">Carregando...</span>
                    </div>

                    <div class="row g-3 align-items-end">
                        <div class="col-12 col-lg-7">
                            <label class="form-label text-white">Status atual</label>
                            <div class="form-control" style="background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
                                <span id="cronogramaStatusLabel">Carregando...</span>
                            </div>
                            <div class="form-text text-white-50">O envio usa a mensagem oficial do status atual.</div>
                        </div>
                        <div class="col-12 col-lg-5 d-flex gap-2 flex-wrap">
                            <button type="button" class="btn btn-success whatsapp-btn-premium" id="btnEnviarCronograma" onclick="enviarCronogramaAgora()">
                                <i class="bi bi-send-check me-1"></i> Enviar agora
                            </button>
                        </div>
                    </div>

                    <div class="alert alert-info mt-4 mb-0 whatsapp-alert-premium" role="alert" style="background:rgba(13,110,253,0.15);color:#fff;">
                        <div class="d-flex align-items-start gap-2">
                            <i class="bi bi-info-circle text-white fs-5"></i>
                            <div class="small" style="color: #fff;">
                                O botão envia imediatamente a mensagem correspondente ao status atual do cronograma.
                            </div>
                        </div>
                    </div>

                    <script>
                        function notifyWhatsappAdmin(title, message, type) {
                            if (typeof showNotification === 'function') {
                                showNotification(title, message, type);
                                return;
                            }
                            alert((title ? title + '\n' : '') + message);
                        }

                        function setCronogramaBadge(text, ok) {
                            const badge = document.getElementById('badgeCronogramaStatus');
                            badge.textContent = text;
                            badge.className = ok
                                ? 'badge bg-success-subtle text-success'
                                : 'badge bg-light text-dark border';
                        }

                        function carregarStatusCronograma() {
                            fetch('/dev/whatsapp/cronograma/status', {
                                headers: { 'X-Requested-With': 'XMLHttpRequest' }
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.ok) {
                                    const status = data.status || 'Indisponível';
                                    document.getElementById('cronogramaStatusLabel').textContent = status;
                                    setCronogramaBadge(status, true);
                                } else {
                                    document.getElementById('cronogramaStatusLabel').textContent = 'Indisponível';
                                    setCronogramaBadge('Indisponível', false);
                                }
                            })
                            .catch(() => {
                                document.getElementById('cronogramaStatusLabel').textContent = 'Indisponível';
                                setCronogramaBadge('Indisponível', false);
                            });
                        }

                        function enviarCronogramaAgora() {
                            const btn = document.getElementById('btnEnviarCronograma');
                            btn.disabled = true;
                            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Enviando...';
                            fetch('/dev/whatsapp/cronograma/enviar', {
                                method: 'POST',
                                headers: { 'X-Requested-With': 'XMLHttpRequest' }
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.ok) {
                                    notifyWhatsappAdmin('Sucesso', data.message || 'Mensagem enviada.', 'success');
                                } else {
                                    notifyWhatsappAdmin('Erro', data.error || 'Falha ao enviar mensagem', 'danger');
                                }
                            })
                            .catch(error => {
                                notifyWhatsappAdmin('Erro', 'Falha na comunicação: ' + error.message, 'danger');
                            })
                            .finally(() => {
                                btn.disabled = false;
                                btn.innerHTML = '<i class="bi bi-send-check me-1"></i> Enviar agora';
                            });
                        }

                        document.addEventListener('DOMContentLoaded', () => {
                            carregarStatusCronograma();
                        });
                    </script>
                </div>
            </div>
        </div>
        {% endif %}
{% endblock %}
