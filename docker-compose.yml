version: '3.9'

services:
  # ============================================================================
  # PostgreSQL - Banco de dados único para TUDO
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: multimax-postgres
    environment:
      POSTGRES_DB: multimax
      POSTGRES_USER: multimax
      POSTGRES_PASSWORD: multimax123
    ports:
      - "5432:5432"
    volumes:
      # Volume EXTERNO à raiz do projeto - dados persistem mesmo se projeto for deletado
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multimax"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================================================
  # Backup automático diário do PostgreSQL
  # ============================================================================
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: multimax-postgres-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: multimax
      POSTGRES_USER: multimax
      POSTGRES_PASSWORD: multimax123
      POSTGRES_EXTRA_OPTS: "-Z9"
      SCHEDULE: "0 2 * * *"  # 2 AM todos os dias
      BACKUP_KEEP_DAYS: 30
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 12
    volumes:
      # Backups salvos FORA do projeto
      - postgres_backups:/backups
    restart: unless-stopped

  # ============================================================================
  # Flask API - Controla tudo
  # ============================================================================
  multimax:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multimax
    ports:
      - "5000:5000"
    volumes:
      - /opt/multimax:/opt/multimax:ro
      - /opt/multimax-data:/opt/multimax-data:rw
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=false
      - GIT_REPO_DIR=/opt/multimax
      # PostgreSQL (dados migrados)
      - DATABASE_URL=postgresql://multimax:multimax123@postgres:5432/multimax
      # WhatsApp
      - WHATSAPP_NOTIFY_URL=http://whatsapp-service:3001/notify
      - WHATSAPP_SERVICE_TOKEN=MaxWhatsTK@963
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # WhatsApp Service - Apenas executor (sem banco, sem config)
  # ============================================================================
  whatsapp-service:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: whatsapp-service
    ports:
      - "3001:3001"
    volumes:
      - whatsapp_auth:/app/auth
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  # Volume do PostgreSQL - EXTERNO
  postgres_data:
    driver: local
  # Backups do PostgreSQL - EXTERNO
  postgres_backups:
    driver: local
  # Autenticação do WhatsApp
  whatsapp_auth:
